<svg xmlns="http://www.w3.org/2000/svg" width="480" height="500" viewBox="0 0 480 500" role="img" aria-labelledby="title desc"><title id="title">Two honest responses reveal the root</title><desc id="desc">For the same r and first message s=r squared modulo N, responses z1=r and z0=r*x reveal x when z0 is multiplied by the inverse of z1. All values are in the unit group.</desc><style>text{font-family:system-ui,-apple-system,sans-serif;font-size:19px;fill:#1e293b}.title{font-size:22px;font-weight:650}.small{font-size:17px}.heading{font-size:21px;font-weight:650}.formula{font-size:22px}</style><rect width="480" height="500" rx="14" fill="#f8fafc"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><text x="22" y="34" class="title" text-anchor="start">Two responses reveal the root</text><rect x="95" y="64" width="290" height="66" rx="10" fill="#e2e8f0" stroke="#94a3b8"/><text x="240" y="93" class="heading" text-anchor="middle">Same r, same s = r²</text><text x="240" y="116" class="small" text-anchor="middle">Honest responses</text><path d="M170,132L120,190" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M310,132L360,190" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="30" y="200" width="180" height="85" rx="10" fill="white" stroke="#94a3b8"/><rect x="270" y="200" width="180" height="85" rx="10" fill="white" stroke="#94a3b8"/><text x="120" y="231" class="" text-anchor="middle">b=1</text><text x="120" y="265" class="formula" text-anchor="middle">z₁ = r</text><text x="360" y="231" class="" text-anchor="middle">b=0</text><text x="360" y="265" class="formula" text-anchor="middle">z₀ = rx</text><path d="M120,287L180,339" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M360,287L300,339" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="40" y="350" width="400" height="80" rx="10" fill="#fee2e2" stroke="#b91c1c"/><text x="240" y="384" class="formula" text-anchor="middle">z₀ · z₁⁻¹ = (rx) · r⁻¹</text><text x="240" y="415" class="formula" text-anchor="middle">= x mod N</text><text x="240" y="471" class="small" text-anchor="middle">One response per round; use fresh r.</text></svg>
