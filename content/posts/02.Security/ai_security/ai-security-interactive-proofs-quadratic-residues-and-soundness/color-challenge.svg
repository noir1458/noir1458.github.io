<svg xmlns="http://www.w3.org/2000/svg" width="480" height="580" viewBox="0 0 480 580" role="img" aria-labelledby="title desc"><title id="title">Color challenge: distinguish a swap</title><desc id="desc">For two different colors, leaving the order unchanged and swapping the order produce different observations for the prover. With the same color in both positions, the observations are identical. The hidden fair bit chooses the operation.</desc><style>text{font-family:system-ui,-apple-system,sans-serif;font-size:19px;fill:#1e293b}.title{font-size:22px;font-weight:650}.small{font-size:17px}.heading{font-size:21px;font-weight:650}.formula{font-size:22px}</style><rect width="480" height="580" rx="14" fill="#f8fafc"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><text x="22" y="34" class="title" text-anchor="start">Can P detect the hidden swap?</text><text x="22" y="73" class="heading" text-anchor="start">Two different colors</text><text x="120" y="110" class="small" text-anchor="middle">B=0: unchanged</text><text x="360" y="110" class="small" text-anchor="middle">B=1: swapped</text><rect x="57" y="128" width="126" height="55" fill="#15803d"/><rect x="57" y="183" width="126" height="55" fill="#9d174d"/><rect x="57" y="128" width="126" height="110" fill="none" stroke="#334155"/><rect x="297" y="128" width="126" height="55" fill="#9d174d"/><rect x="297" y="183" width="126" height="55" fill="#15803d"/><rect x="297" y="128" width="126" height="110" fill="none" stroke="#334155"/><text x="240" y="273" class="" text-anchor="middle">P sees different orders.</text><text x="22" y="323" class="heading" text-anchor="start">Only one color</text><text x="120" y="360" class="small" text-anchor="middle">B=0: unchanged</text><text x="360" y="360" class="small" text-anchor="middle">B=1: swapped</text><rect x="57" y="378" width="126" height="55" fill="#15803d"/><rect x="57" y="433" width="126" height="55" fill="#15803d"/><rect x="57" y="378" width="126" height="110" fill="none" stroke="#334155"/><rect x="297" y="378" width="126" height="55" fill="#15803d"/><rect x="297" y="433" width="126" height="55" fill="#15803d"/><rect x="297" y="378" width="126" height="110" fill="none" stroke="#334155"/><text x="240" y="524" class="" text-anchor="middle">P sees the same result.</text><text x="240" y="559" class="small" text-anchor="middle">Without another clue: at most 1/2.</text></svg>
