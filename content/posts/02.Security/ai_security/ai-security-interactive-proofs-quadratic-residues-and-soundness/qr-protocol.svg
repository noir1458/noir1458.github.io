<svg xmlns="http://www.w3.org/2000/svg" width="480" height="650" viewBox="0 0 480 650" role="img" aria-labelledby="title desc"><title id="title">A round of the QR interactive proof</title><desc id="desc">Public input N,y and private square root x. First the prover sends s=r squared modulo N. Next the verifier sends a uniform bit b. Then the prover sends r for b=1 or r*x modulo N for b=0. The verifier checks unit membership and the corresponding square equation.</desc><style>text{font-family:system-ui,-apple-system,sans-serif;font-size:19px;fill:#1e293b}.title{font-size:22px;font-weight:650}.small{font-size:17px}.heading{font-size:21px;font-weight:650}.formula{font-size:22px}</style><rect width="480" height="650" rx="14" fill="#f8fafc"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><text x="22" y="34" class="title" text-anchor="start">Commit, challenge, respond</text><rect x="22" y="55" width="436" height="64" rx="10" fill="#e2e8f0" stroke="#94a3b8"/><text x="240" y="83" class="heading" text-anchor="middle">Public: N,y</text><text x="240" y="108" class="small" text-anchor="middle">P keeps x; x² ≡ y (mod N)</text><rect x="22" y="150" width="144" height="60" rx="10" fill="white" stroke="#94a3b8"/><rect x="314" y="150" width="144" height="60" rx="10" fill="white" stroke="#94a3b8"/><text x="94" y="188" class="heading" text-anchor="middle">Prover P</text><text x="386" y="188" class="heading" text-anchor="middle">Verifier V</text><path d="M94,212L94,525" fill="none" stroke="#64748b" stroke-width="2.3" stroke-dasharray="5 5"/><path d="M386,212L386,525" fill="none" stroke="#64748b" stroke-width="2.3" stroke-dasharray="5 5"/><text x="240" y="246" class="" text-anchor="middle">1. s = r² mod N</text><path d="M94,270L386,270" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"/><text x="240" y="316" class="" text-anchor="middle">2. Fresh uniform b ∈ {0,1}</text><path d="M386,342L94,342" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"/><text x="240" y="397" class="" text-anchor="middle">3. z = r       if b=1</text><text x="240" y="426" class="" text-anchor="middle">z = rx mod N  if b=0</text><path d="M94,452L386,452" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="22" y="495" width="436" height="128" rx="10" fill="white" stroke="#94a3b8"/><text x="240" y="527" class="heading" text-anchor="middle">Check y,s,z ∈ ℤ<tspan baseline-shift="super" font-size="15">*</tspan><tspan baseline-shift="sub" font-size="15" dx="-6">N</tspan></text><text x="240" y="565" class="formula" text-anchor="middle">z² ≡ s·y<tspan baseline-shift="super" font-size="15">1−b</tspan> (mod N)</text><text x="240" y="601" class="small" text-anchor="middle">Accept iff the checks pass.</text></svg>
