<svg xmlns="http://www.w3.org/2000/svg" width="480" height="520" viewBox="0 0 480 520" role="img" aria-labelledby="title desc"><title id="title">Cyclic diagonals in the three by three algebra example</title><desc id="desc">The matrix with rows 1,2,3;4,5,6;7,8,9 has cyclic diagonals 1,5,9 and 2,6,7 and 3,4,8. Their products with the rotated vector 1,2,3 sum to 14,32,50.</desc><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#1e293b;font-size:17px}.small{font-size:15px}.title{font-size:20px;font-weight:650}.number{font-size:22px}</style><rect width="480" height="520" rx="14" fill="#f8fafc"/><text class="title" x="24" y="34">Cyclic diagonals: a 3 × 3 example</text><text class="small" x="24" y="61">Each colour selects one entry in every row.</text><rect x="32" y="108" width="64" height="52" fill="#dbeafe" stroke="#94a3b8"/><text class="number" text-anchor="middle" x="64" y="142">1</text><rect x="96" y="108" width="64" height="52" fill="#ffedd5" stroke="#94a3b8"/><text class="number" text-anchor="middle" x="128" y="142">2</text><rect x="160" y="108" width="64" height="52" fill="#dcfce7" stroke="#94a3b8"/><text class="number" text-anchor="middle" x="192" y="142">3</text><rect x="32" y="160" width="64" height="52" fill="#dcfce7" stroke="#94a3b8"/><text class="number" text-anchor="middle" x="64" y="194">4</text><rect x="96" y="160" width="64" height="52" fill="#dbeafe" stroke="#94a3b8"/><text class="number" text-anchor="middle" x="128" y="194">5</text><rect x="160" y="160" width="64" height="52" fill="#ffedd5" stroke="#94a3b8"/><text class="number" text-anchor="middle" x="192" y="194">6</text><rect x="32" y="212" width="64" height="52" fill="#ffedd5" stroke="#94a3b8"/><text class="number" text-anchor="middle" x="64" y="246">7</text><rect x="96" y="212" width="64" height="52" fill="#dcfce7" stroke="#94a3b8"/><text class="number" text-anchor="middle" x="128" y="246">8</text><rect x="160" y="212" width="64" height="52" fill="#dbeafe" stroke="#94a3b8"/><text class="number" text-anchor="middle" x="192" y="246">9</text><text x="128" y="93" text-anchor="middle">A</text><text x="306" y="93" text-anchor="middle">x</text><text x="422" y="93" text-anchor="middle">y</text><rect x="276" y="108" width="60" height="52" fill="white" stroke="#94a3b8"/><text class="number" text-anchor="middle" x="306" y="142">1</text><rect x="392" y="108" width="60" height="52" fill="white" stroke="#94a3b8"/><text class="number" text-anchor="middle" x="422" y="142">14</text><rect x="276" y="160" width="60" height="52" fill="white" stroke="#94a3b8"/><text class="number" text-anchor="middle" x="306" y="194">2</text><rect x="392" y="160" width="60" height="52" fill="white" stroke="#94a3b8"/><text class="number" text-anchor="middle" x="422" y="194">32</text><rect x="276" y="212" width="60" height="52" fill="white" stroke="#94a3b8"/><text class="number" text-anchor="middle" x="306" y="246">3</text><rect x="392" y="212" width="60" height="52" fill="white" stroke="#94a3b8"/><text class="number" text-anchor="middle" x="422" y="246">50</text><text class="number" x="242" y="197">×</text><text class="number" x="358" y="197">=</text><rect x="24" y="294" width="5" height="27" rx="2" fill="#1d4ed8"/><text x="40" y="314" style="fill:#1d4ed8">d₀ ⊙ R₀(x) = (1, 10, 27)</text><rect x="24" y="337" width="5" height="27" rx="2" fill="#9a3412"/><text x="40" y="357" style="fill:#9a3412">d₁ ⊙ R₁(x) = (4, 18, 7)</text><rect x="24" y="380" width="5" height="27" rx="2" fill="#166534"/><text x="40" y="400" style="fill:#166534">d₂ ⊙ R₂(x) = (9, 4, 16)</text><line x1="24" y1="424" x2="456" y2="424" stroke="#94a3b8"/><text x="24" y="458">Sum = (14, 32, 50) = A x</text><text class="small" x="24" y="496">Length-3 vector algebra; CKKS padding is separate.</text></svg>