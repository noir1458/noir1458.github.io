<svg xmlns="http://www.w3.org/2000/svg" width="480" height="478" viewBox="0 0 480 478" role="img" aria-labelledby="title desc"><title id="title">Baby step giant step rotation grid</title><desc id="desc">For sixteen slots, the four giant offsets 0,4,8,12 combine with baby offsets 0,1,2,3 to give all offsets zero through fifteen. The highlighted offset seven is four plus three. The number of rotations is three baby plus three giant, six total.</desc><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#1e293b;font-size:17px}.small{font-size:15px}.title{font-size:20px;font-weight:650}.number{font-size:22px}</style><rect width="480" height="478" rx="14" fill="#f8fafc"/><text class="title" x="24" y="34">BSGS: 4 + 3 = 7</text><text class="small" x="24" y="61">16 slots; 4 baby steps; 4 giant blocks.</text><text class="small" x="24" y="89">Giant</text><text class="small" x="260" y="89" text-anchor="middle">Baby offset</text><text x="140" y="118" text-anchor="middle">0</text><text x="220" y="118" text-anchor="middle">1</text><text x="300" y="118" text-anchor="middle">2</text><text x="380" y="118" text-anchor="middle">3</text><text x="59" y="166" text-anchor="middle">0</text><rect x="100" y="132" width="80" height="56" fill="#e8f0fb" stroke="#94a3b8" stroke-width="1"/><text class="number" x="140" y="168" text-anchor="middle" style="fill:#1e293b">0</text><rect x="180" y="132" width="80" height="56" fill="#e8f0fb" stroke="#94a3b8" stroke-width="1"/><text class="number" x="220" y="168" text-anchor="middle" style="fill:#1e293b">1</text><rect x="260" y="132" width="80" height="56" fill="#e8f0fb" stroke="#94a3b8" stroke-width="1"/><text class="number" x="300" y="168" text-anchor="middle" style="fill:#1e293b">2</text><rect x="340" y="132" width="80" height="56" fill="#e8f0fb" stroke="#94a3b8" stroke-width="1"/><text class="number" x="380" y="168" text-anchor="middle" style="fill:#1e293b">3</text><text x="59" y="222" text-anchor="middle">4</text><rect x="100" y="188" width="80" height="56" fill="#e8f0fb" stroke="#94a3b8" stroke-width="1"/><text class="number" x="140" y="224" text-anchor="middle" style="fill:#1e293b">4</text><rect x="180" y="188" width="80" height="56" fill="#e8f0fb" stroke="#94a3b8" stroke-width="1"/><text class="number" x="220" y="224" text-anchor="middle" style="fill:#1e293b">5</text><rect x="260" y="188" width="80" height="56" fill="#e8f0fb" stroke="#94a3b8" stroke-width="1"/><text class="number" x="300" y="224" text-anchor="middle" style="fill:#1e293b">6</text><rect x="340" y="188" width="80" height="56" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/><text class="number" x="380" y="224" text-anchor="middle" style="fill:#9a3412">7</text><text x="59" y="278" text-anchor="middle">8</text><rect x="100" y="244" width="80" height="56" fill="#e8f0fb" stroke="#94a3b8" stroke-width="1"/><text class="number" x="140" y="280" text-anchor="middle" style="fill:#1e293b">8</text><rect x="180" y="244" width="80" height="56" fill="#e8f0fb" stroke="#94a3b8" stroke-width="1"/><text class="number" x="220" y="280" text-anchor="middle" style="fill:#1e293b">9</text><rect x="260" y="244" width="80" height="56" fill="#e8f0fb" stroke="#94a3b8" stroke-width="1"/><text class="number" x="300" y="280" text-anchor="middle" style="fill:#1e293b">10</text><rect x="340" y="244" width="80" height="56" fill="#e8f0fb" stroke="#94a3b8" stroke-width="1"/><text class="number" x="380" y="280" text-anchor="middle" style="fill:#1e293b">11</text><text x="59" y="334" text-anchor="middle">12</text><rect x="100" y="300" width="80" height="56" fill="#e8f0fb" stroke="#94a3b8" stroke-width="1"/><text class="number" x="140" y="336" text-anchor="middle" style="fill:#1e293b">12</text><rect x="180" y="300" width="80" height="56" fill="#e8f0fb" stroke="#94a3b8" stroke-width="1"/><text class="number" x="220" y="336" text-anchor="middle" style="fill:#1e293b">13</text><rect x="260" y="300" width="80" height="56" fill="#e8f0fb" stroke="#94a3b8" stroke-width="1"/><text class="number" x="300" y="336" text-anchor="middle" style="fill:#1e293b">14</text><rect x="340" y="300" width="80" height="56" fill="#e8f0fb" stroke="#94a3b8" stroke-width="1"/><text class="number" x="380" y="336" text-anchor="middle" style="fill:#1e293b">15</text><text class="small" x="24" y="387">Highlighted cell: giant 4 + baby 3 = 7.</text><text class="small" x="24" y="419">Baby rotations: 3  |  Giant rotations: 3</text><text x="24" y="453">15 direct rotations → 6 with BSGS.</text></svg>