<svg xmlns="http://www.w3.org/2000/svg" width="480" height="510" viewBox="0 0 480 510" role="img" aria-labelledby="title desc"><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#1e293b;font-size:17px}.small{font-size:15px}.title{font-size:20px;font-weight:650}.grid{stroke:#e2e8f0;stroke-width:1}.axis{stroke:#64748b;stroke-width:1.6}</style><title id="title">N equals 4: roots and complex conjugates</title><desc id="desc">Four roots of X to the fourth plus one at 45,135,225,315 degrees. Conjugate pairs are zeta zero and zeta three, zeta one and zeta two. The other four eighth roots lie on the axes.</desc><rect width="480" height="510" rx="14" fill="#f8fafc"/><text class="title" x="24" y="34">N = 4: roots of x⁴ + 1</text><text class="small" x="24" y="61">Start with x⁸ = 1; keep the 4 odd powers.</text><circle cx="240" cy="252" r="127" fill="none" stroke="#94a3b8" stroke-width="1.5"/><line class="axis" x1="67" y1="252" x2="417" y2="252"/><line class="axis" x1="240" y1="83" x2="240" y2="421"/><text x="424" y="258">Re</text><text x="247" y="97">Im</text><line x1="329.80" y1="162.20" x2="329.80" y2="341.80" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="150.20" y1="162.20" x2="150.20" y2="341.80" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="5 5"/><circle cx="367.00" cy="252.00" r="5" fill="#64748b" stroke="white" stroke-width="1.5"/><circle cx="329.80" cy="162.20" r="7" fill="#2563eb" stroke="white" stroke-width="2"/><text x="342.80" y="149.20" text-anchor="start" style="fill:#2563eb">ζ<tspan baseline-shift="sub" font-size="12">0</tspan></text><circle cx="240.00" cy="125.00" r="5" fill="#64748b" stroke="white" stroke-width="1.5"/><circle cx="150.20" cy="162.20" r="7" fill="#c2410c" stroke="white" stroke-width="2"/><text x="137.20" y="149.20" text-anchor="end" style="fill:#c2410c">ζ<tspan baseline-shift="sub" font-size="12">1</tspan></text><circle cx="113.00" cy="252.00" r="5" fill="#64748b" stroke="white" stroke-width="1.5"/><circle cx="150.20" cy="341.80" r="7" fill="#c2410c" stroke="white" stroke-width="2"/><text x="137.20" y="364.80" text-anchor="end" style="fill:#c2410c">ζ<tspan baseline-shift="sub" font-size="12">2</tspan></text><circle cx="240.00" cy="379.00" r="5" fill="#64748b" stroke="white" stroke-width="1.5"/><circle cx="329.80" cy="341.80" r="7" fill="#2563eb" stroke="white" stroke-width="2"/><text x="342.80" y="364.80" text-anchor="start" style="fill:#2563eb">ζ<tspan baseline-shift="sub" font-size="12">3</tspan></text><text class="small" x="24" y="450">Conjugation reflects across the real axis.</text><text class="small" x="24" y="477">ζ₀ ↔ ζ₃, ζ₁ ↔ ζ₂: only 2 independent slots.</text></svg>