<svg xmlns="http://www.w3.org/2000/svg" width="480" height="570" viewBox="0 0 480 570" role="img" aria-labelledby="title desc"><title id="title">Recursive Chebyshev division and recombination</title><desc id="desc">A degree at most fifteen polynomial is split by T8 into q and r of degree at most seven. Splitting both by T4 gives four leaves of degree at most three. Evaluate all leaves with T0 to T3 and combine upward.</desc><style>text{font-family:system-ui,-apple-system,sans-serif;font-size:16px;fill:#1e293b}.small{font-size:14px}.title{font-size:20px;font-weight:650}.label{font-size:17px}</style><rect width="480" height="570" rx="14" fill="#f8fafc"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><text x="20" y="31" class="title" >Divide, evaluate leaves, recombine</text><rect x="146.5" y="58" width="142" height="60" rx="8" fill="white" stroke="#94a3b8"/><text x="217.5" y="83" class="label" text-anchor="middle">p(t)</text><text x="217.5" y="105" class="small" text-anchor="middle">degree ≤ 15</text><path d="M217.5,120L112.5,181" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><path d="M217.5,120L322.5,181" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="57.5" y="185" width="110" height="60" rx="8" fill="white" stroke="#94a3b8"/><text x="112.5" y="210" class="label" text-anchor="middle">q(t)</text><text x="112.5" y="232" class="small" text-anchor="middle">degree ≤ 7</text><rect x="267.5" y="185" width="110" height="60" rx="8" fill="white" stroke="#94a3b8"/><text x="322.5" y="210" class="label" text-anchor="middle">r(t)</text><text x="322.5" y="232" class="small" text-anchor="middle">degree ≤ 7</text><rect x="420" y="132" width="48" height="32" rx="4" fill="#dbeafe"/><text x="444" y="154" class="label" text-anchor="middle">T₈</text><path d="M112.5,247L60,334" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><path d="M112.5,247L165,334" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><path d="M322.5,247L270,334" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><path d="M322.5,247L375,334" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="420" y="279" width="48" height="32" rx="4" fill="#dbeafe"/><text x="444" y="301" class="label" text-anchor="middle">T₄</text><rect x="16" y="338" width="88" height="60" rx="8" fill="white" stroke="#94a3b8"/><text x="60" y="363" class="label" text-anchor="middle">u₀</text><text x="60" y="385" class="small" text-anchor="middle">degree ≤ 3</text><rect x="121" y="338" width="88" height="60" rx="8" fill="white" stroke="#94a3b8"/><text x="165" y="363" class="label" text-anchor="middle">u₁</text><text x="165" y="385" class="small" text-anchor="middle">degree ≤ 3</text><rect x="226" y="338" width="88" height="60" rx="8" fill="white" stroke="#94a3b8"/><text x="270" y="363" class="label" text-anchor="middle">u₂</text><text x="270" y="385" class="small" text-anchor="middle">degree ≤ 3</text><rect x="331" y="338" width="88" height="60" rx="8" fill="white" stroke="#94a3b8"/><text x="375" y="363" class="label" text-anchor="middle">u₃</text><text x="375" y="385" class="small" text-anchor="middle">degree ≤ 3</text><text x="20" y="442" class="label" >q = u₀ × T₄ + u₁</text><text x="20" y="472" class="label" >r = u₂ × T₄ + u₃</text><text x="20" y="502" class="label" >p = q × T₈ + r</text><text x="20" y="550" class="small" >Reuse T₀,T₁,T₂,T₃ in all four leaves.</text></svg>
