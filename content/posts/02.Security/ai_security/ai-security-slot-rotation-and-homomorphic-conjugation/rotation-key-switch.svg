<svg xmlns="http://www.w3.org/2000/svg" width="480" height="550" viewBox="0 0 480 550" role="img" aria-labelledby="title desc"><title id="title">Substitution and key switching</title><desc id="desc">The input ciphertext is under secret key s. Applying the same automorphism to both components changes the key to tau of s. Key switching adds beta to tau of u and returns a two-component ciphertext under s.</desc><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#1e293b;font-size:17px}.small{font-size:15px}.title{font-size:20px;font-weight:650}.math{font-size:20px}</style><rect width="480" height="550" rx="14" fill="#f8fafc"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/></marker><marker id="wrap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#c2410c"/></marker></defs><text class="title" x="24" y="34">Substitution → key switching</text><text class="small" x="24" y="62">Used for both rotation and conjugation.</text><rect x="24" y="87" width="432" height="101" rx="9" fill="white" stroke="#94a3b8" stroke-width="1.4"/><text class="small" x="42" y="112">INPUT</text><text class="math" x="42" y="148">c = (u, v)</text><text class="small" x="42" y="172" style="fill:#2563eb">key: s</text><rect x="24" y="242" width="432" height="101" rx="9" fill="white" stroke="#94a3b8" stroke-width="1.4"/><text class="small" x="42" y="267">AFTER SUBSTITUTION</text><text class="math" x="42" y="303">c<tspan baseline-shift="super" font-size="13">τ</tspan> = (τ(u), τ(v))</text><text class="small" x="42" y="327" style="fill:#2563eb">key: τ(s)</text><rect x="24" y="397" width="432" height="101" rx="9" fill="white" stroke="#94a3b8" stroke-width="1.4"/><text class="small" x="42" y="422">AFTER KEY SWITCHING</text><text class="math" x="42" y="458">c′ = (τ(u) + β, α)</text><text class="small" x="42" y="482" style="fill:#2563eb">key: s</text><path d="M 240 189 L 240 234" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text class="small" x="258" y="217">apply τ to both parts</text><path d="M 240 344 L 240 389" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text class="small" x="258" y="372">KS: τ(s) → s</text><text class="small" x="24" y="532">Final modulus q and scale Δ are unchanged.</text></svg>