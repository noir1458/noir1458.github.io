<svg xmlns="http://www.w3.org/2000/svg" width="480" height="430" viewBox="0 0 480 430" role="img" aria-labelledby="title desc"><title id="title">Four-slot left rotation at N equals 8</title><desc id="desc">The selected root exponents are 1,5,9,13 modulo16. Substitution by X to the fifth makes output slot k read input slot k plus one. Input zero wraps to the last output.</desc><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#1e293b;font-size:17px}.small{font-size:15px}.title{font-size:20px;font-weight:650}.math{font-size:20px}</style><rect width="480" height="430" rx="14" fill="#f8fafc"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/></marker><marker id="wrap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#c2410c"/></marker></defs><text class="title" x="24" y="34">N = 8: one-step left rotation</text><text class="small" x="24" y="62">Root exponents: 1 → 5 → 9 → 13 → 1 (mod 16)</text><text class="small" x="24" y="97">INPUT</text><text class="small" x="32" y="337">OUTPUT: τ₅(f)</text><rect x="24" y="108" width="90" height="65" rx="8" fill="white" stroke="#c2410c" stroke-width="1.5"/><text class="math" x="69" y="139" text-anchor="middle">z₀</text><text class="small" x="69" y="161" text-anchor="middle">exp 1</text><rect x="24" y="246" width="90" height="65" rx="8" fill="white" stroke="#2563eb" stroke-width="1.5"/><text class="math" x="69" y="286" text-anchor="middle">z₁</text><rect x="138" y="108" width="90" height="65" rx="8" fill="white" stroke="#2563eb" stroke-width="1.5"/><text class="math" x="183" y="139" text-anchor="middle">z₁</text><text class="small" x="183" y="161" text-anchor="middle">exp 5</text><rect x="138" y="246" width="90" height="65" rx="8" fill="white" stroke="#2563eb" stroke-width="1.5"/><text class="math" x="183" y="286" text-anchor="middle">z₂</text><rect x="252" y="108" width="90" height="65" rx="8" fill="white" stroke="#2563eb" stroke-width="1.5"/><text class="math" x="297" y="139" text-anchor="middle">z₂</text><text class="small" x="297" y="161" text-anchor="middle">exp 9</text><rect x="252" y="246" width="90" height="65" rx="8" fill="white" stroke="#2563eb" stroke-width="1.5"/><text class="math" x="297" y="286" text-anchor="middle">z₃</text><rect x="366" y="108" width="90" height="65" rx="8" fill="white" stroke="#2563eb" stroke-width="1.5"/><text class="math" x="411" y="139" text-anchor="middle">z₃</text><text class="small" x="411" y="161" text-anchor="middle">exp 13</text><rect x="366" y="246" width="90" height="65" rx="8" fill="white" stroke="#c2410c" stroke-width="1.5"/><text class="math" x="411" y="286" text-anchor="middle">z₀</text><path d="M 183 174 L 69 240" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M 297 174 L 183 240" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M 411 174 L 297 240" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M 69 174 L 69 190 L 12 190 L 12 359 L 411 359 L 411 317" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#wrap)"/><text class="small" x="24" y="396">Output k reads input (k + 1) mod 4.</text><text class="small" x="24" y="419">The last output reads z₀.</text></svg>