<svg xmlns="http://www.w3.org/2000/svg" width="480" height="570" viewBox="0 0 480 570" role="img" aria-labelledby="title desc"><title id="title">NP proof: send a witness, then verify</title><desc id="desc">The public instance x is available to both parties. The prover sends w. The verifier checks V(x,w) and outputs accept or reject. Sending the witness directly reveals it to the verifier.</desc><style>text{font-family:system-ui,-apple-system,sans-serif;font-size:19px;fill:#1e293b}.title{font-size:23px;font-weight:650}.small{font-size:17px}.node{font-size:21px;font-weight:650}.heading{font-size:21px;font-weight:650}</style><rect width="480" height="570" rx="14" fill="#f8fafc"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><text x="22" y="36" class="title" text-anchor="start">Send a witness, then verify</text><rect x="22" y="60" width="436" height="64" rx="10" fill="#e2e8f0" stroke="#94a3b8"/><text x="240" y="88" class="heading" text-anchor="middle">Public input: x</text><text x="240" y="111" class="small" text-anchor="middle">Available to P and V</text><rect x="22" y="160" width="146" height="106" rx="10" fill="#ffffff" stroke="#94a3b8"/><text x="95" y="192" class="heading" text-anchor="middle">Prover P</text><text x="95" y="225" class="" text-anchor="middle">provides w</text><text x="95" y="249" class="small" text-anchor="middle">no time bound</text><rect x="312" y="160" width="146" height="106" rx="10" fill="#ffffff" stroke="#94a3b8"/><text x="385" y="192" class="heading" text-anchor="middle">Verifier V</text><text x="385" y="225" class="" text-anchor="middle">receives w</text><text x="385" y="249" class="small" text-anchor="middle">polynomial time</text><path d="M168,209L310,209" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/><text x="240" y="193" class="" text-anchor="middle">w</text><text x="240" y="296" class="" text-anchor="middle">|w| ≤ p(|x|)</text><path d="M385,267L385,320" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="220" y="326" width="238" height="64" rx="10" fill="#ffffff" stroke="#94a3b8"/><text x="339" y="365" class="" text-anchor="middle">Compute V(x, w)</text><path d="M280,390L250,432" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M398,390L414,432" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="184" y="438" width="126" height="53" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="247" y="472" class="" text-anchor="middle">1: accept</text><rect x="334" y="438" width="124" height="53" rx="10" fill="#fee2e2" stroke="#b91c1c"/><text x="396" y="472" class="" text-anchor="middle">0: reject</text><text x="22" y="530" class="small" text-anchor="start">Direct transmission also reveals w.</text><text x="22" y="555" class="small" text-anchor="start">This is the ordinary NP proof model.</text></svg>
