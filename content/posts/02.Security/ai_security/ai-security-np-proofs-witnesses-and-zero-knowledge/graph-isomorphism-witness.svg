<svg xmlns="http://www.w3.org/2000/svg" width="480" height="500" viewBox="0 0 480 500" role="img" aria-labelledby="title desc"><title id="title">An explicit graph isomorphism witness</title><desc id="desc">Top graph G0 has edges 12 and 23. Bottom graph G1 has edges 12 and 13. The arrows map vertex 1 to 2, 2 to 1, and 3 to 3. Both edges and the nonedge are preserved.</desc><style>text{font-family:system-ui,-apple-system,sans-serif;font-size:19px;fill:#1e293b}.title{font-size:23px;font-weight:650}.small{font-size:17px}.node{font-size:21px;font-weight:650}.heading{font-size:21px;font-weight:650}</style><rect width="480" height="500" rx="14" fill="#f8fafc"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><text x="22" y="36" class="title" text-anchor="start">Same edges after relabeling</text><text x="22" y="74" class="heading" text-anchor="start">G₀</text><text x="22" y="274" class="heading" text-anchor="start">G₁</text><path d="M85,135L240,105" fill="none" stroke="#64748b" stroke-width="2.4"/><path d="M240,105L395,135" fill="none" stroke="#64748b" stroke-width="2.4"/><path d="M85,335L240,305" fill="none" stroke="#64748b" stroke-width="2.4"/><path d="M240,305L395,335" fill="none" stroke="#64748b" stroke-width="2.4"/><path d="M85,164L85,306" fill="none" stroke="#64748b" stroke-width="2.4" stroke-dasharray="5 5" marker-end="url(#arrow)"/><circle cx="85" cy="135" r="25" fill="white" stroke="#2563eb" stroke-width="3"/><text x="85" y="142" class="node" text-anchor="middle">1</text><circle cx="85" cy="335" r="25" fill="white" stroke="#2563eb" stroke-width="3"/><text x="85" y="342" class="node" text-anchor="middle">2</text><path d="M240,134L240,276" fill="none" stroke="#64748b" stroke-width="2.4" stroke-dasharray="5 5" marker-end="url(#arrow)"/><circle cx="240" cy="105" r="25" fill="white" stroke="#15803d" stroke-width="3"/><text x="240" y="112" class="node" text-anchor="middle">2</text><circle cx="240" cy="305" r="25" fill="white" stroke="#15803d" stroke-width="3"/><text x="240" y="312" class="node" text-anchor="middle">1</text><path d="M395,164L395,306" fill="none" stroke="#64748b" stroke-width="2.4" stroke-dasharray="5 5" marker-end="url(#arrow)"/><circle cx="395" cy="135" r="25" fill="white" stroke="#9333ea" stroke-width="3"/><text x="395" y="142" class="node" text-anchor="middle">3</text><circle cx="395" cy="335" r="25" fill="white" stroke="#9333ea" stroke-width="3"/><text x="395" y="342" class="node" text-anchor="middle">3</text><text x="240" y="402" class="" text-anchor="middle">π(1)=2,  π(2)=1,  π(3)=3</text><text x="22" y="447" class="small" text-anchor="start">G₀: edges {1,2}, {2,3}</text><text x="22" y="476" class="small" text-anchor="start">G₁: edges {1,2}, {1,3}</text></svg>
