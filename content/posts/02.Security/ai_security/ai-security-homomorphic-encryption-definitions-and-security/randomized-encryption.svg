<svg xmlns="http://www.w3.org/2000/svg" width="460" height="570" viewBox="0 0 460 570" role="img" aria-labelledby="title desc">
  <title id="title">Randomized encryption of the same plaintext</title>
  <desc id="desc">A plaintext m is encrypted with randomness r and r prime to produce possibly different ciphertexts c and c prime. Both correctly decrypt to m. The shaded region groups valid ciphertexts for the same plaintext.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="458" height="568" rx="16" fill="#fff" stroke="#cbd5e1"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#0f172a">
    <text x="230" y="36" font-size="20" font-weight="700">Same plaintext, many ciphertexts</text>
    <rect x="184" y="60" width="92" height="62" rx="12" fill="#f1f5f9" stroke="#64748b"/>
    <text x="230" y="100" font-size="30" font-style="italic">m</text>
    <rect x="40" y="200" width="380" height="178" rx="35" fill="#eff6ff" fill-opacity="0.8" stroke="#2563eb" stroke-width="1.6"/>
    <path d="M 207 124 Q 134 150 126 231" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 253 124 Q 326 150 334 231" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="100" y="171" font-size="18">Enc with r</text>
    <text x="360" y="171" font-size="18">Enc with r′</text>
    <circle cx="126" cy="263" r="31" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
    <circle cx="334" cy="263" r="31" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
    <text x="126" y="273" font-size="30" font-style="italic">c</text>
    <text x="334" y="273" font-size="30" font-style="italic">c′</text>
    <text x="230" y="331" font-size="19">c ≠ c′ is possible</text>
    <text x="230" y="358" font-size="17" fill="#334155">valid ciphertexts for m</text>
    <path d="M 126 295 C 111 344 105 422 211 468" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 334 295 C 349 344 355 422 249 468" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="90" y="425" font-size="18">Dec with sk</text>
    <text x="370" y="425" font-size="18">Dec with sk</text>
    <rect x="184" y="470" width="92" height="62" rx="12" fill="#f1f5f9" stroke="#64748b"/>
    <text x="230" y="511" font-size="30" font-style="italic">m</text>
    <text x="230" y="552" font-size="16" fill="#475569">Correct decryption, same message</text>
  </g>
</svg>
