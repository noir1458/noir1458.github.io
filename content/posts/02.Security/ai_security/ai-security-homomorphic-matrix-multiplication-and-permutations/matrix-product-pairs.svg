<svg xmlns="http://www.w3.org/2000/svg" width="480" height="425" viewBox="0 0 480 425" role="img" aria-labelledby="title desc"><title id="title">Four terms at output zero one</title><desc id="desc">For output position zero one, shared inner indices are 1,2,3,0. Products are 2 times 600, 3 times 1000, 4 times 1400, and 1 times 200. Their sum is 10000.</desc><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#1e293b;font-size:17px}.small{font-size:15px}.title{font-size:20px;font-weight:650}.value{font-size:20px}</style><rect width="480" height="425" rx="14" fill="#f8fafc"/><text class="title" x="20" y="34">Four terms at output (0,1)</text><text class="small" x="20" y="63">Both factors share the same inner index r.</text><text class="small" x="45" y="104" text-anchor="middle">k</text><text class="small" x="100" y="104" text-anchor="middle">r</text><text class="small" x="180" y="104" text-anchor="middle">A value</text><text class="small" x="270" y="104" text-anchor="middle">B value</text><text class="small" x="390" y="104" text-anchor="middle">Product</text><rect x="20" y="117" width="440" height="48" fill="#eff6ff" stroke="#cbd5e1"/><text class="value" x="45" y="148" text-anchor="middle">0</text><text class="value" x="100" y="148" text-anchor="middle">1</text><text class="value" x="180" y="148" text-anchor="middle">2</text><text class="value" x="270" y="148" text-anchor="middle">600</text><text class="value" x="390" y="148" text-anchor="middle">1200</text><rect x="20" y="165" width="440" height="48" fill="white" stroke="#cbd5e1"/><text class="value" x="45" y="196" text-anchor="middle">1</text><text class="value" x="100" y="196" text-anchor="middle">2</text><text class="value" x="180" y="196" text-anchor="middle">3</text><text class="value" x="270" y="196" text-anchor="middle">1000</text><text class="value" x="390" y="196" text-anchor="middle">3000</text><rect x="20" y="213" width="440" height="48" fill="#eff6ff" stroke="#cbd5e1"/><text class="value" x="45" y="244" text-anchor="middle">2</text><text class="value" x="100" y="244" text-anchor="middle">3</text><text class="value" x="180" y="244" text-anchor="middle">4</text><text class="value" x="270" y="244" text-anchor="middle">1400</text><text class="value" x="390" y="244" text-anchor="middle">5600</text><rect x="20" y="261" width="440" height="48" fill="white" stroke="#cbd5e1"/><text class="value" x="45" y="292" text-anchor="middle">3</text><text class="value" x="100" y="292" text-anchor="middle">0</text><text class="value" x="180" y="292" text-anchor="middle">1</text><text class="value" x="270" y="292" text-anchor="middle">200</text><text class="value" x="390" y="292" text-anchor="middle">200</text><text x="20" y="358">1200 + 3000 + 5600 + 200 = 10000</text><text class="small" x="20" y="395">The order is 1,2,3,0: every inner index appears once.</text></svg>
