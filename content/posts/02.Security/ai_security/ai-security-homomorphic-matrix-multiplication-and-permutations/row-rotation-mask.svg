<svg xmlns="http://www.w3.org/2000/svg" width="480" height="432" viewBox="0 0 480 432" role="img" aria-labelledby="title desc"><title id="title">Use two masks for a row rotation</title><desc id="desc">A full one-slot rotation gives 2,3,4,5 in the first row. Keep the first three with U0. A negative-three rotation gives 14,15,16,1. Keep the final value with U1. Add the masked rows to get 2,3,4,1.</desc><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#1e293b;font-size:17px}.small{font-size:15px}.title{font-size:20px;font-weight:650}.value{font-size:20px}</style><rect width="480" height="432" rx="14" fill="#f8fafc"/><text class="title" x="20" y="34">A row rotation needs two pieces</text><text class="small" x="20" y="62">Apply each mask, then add. d=4, n=16.</text><text class="small" x="20" y="116">Rot(+1)</text><rect x="122" y="88" width="80" height="42" rx="4" fill="white" stroke="#94a3b8"/><text class="value" x="162" y="116" text-anchor="middle">2</text><rect x="206" y="88" width="80" height="42" rx="4" fill="white" stroke="#94a3b8"/><text class="value" x="246" y="116" text-anchor="middle">3</text><rect x="290" y="88" width="80" height="42" rx="4" fill="white" stroke="#94a3b8"/><text class="value" x="330" y="116" text-anchor="middle">4</text><rect x="374" y="88" width="80" height="42" rx="4" fill="#ffe4e6" stroke="#94a3b8"/><text class="value" x="414" y="116" text-anchor="middle">5</text><text class="small" x="20" y="165">U₀</text><rect x="122" y="137" width="80" height="42" rx="4" fill="white" stroke="#94a3b8"/><text class="value" x="162" y="165" text-anchor="middle">1</text><rect x="206" y="137" width="80" height="42" rx="4" fill="white" stroke="#94a3b8"/><text class="value" x="246" y="165" text-anchor="middle">1</text><rect x="290" y="137" width="80" height="42" rx="4" fill="white" stroke="#94a3b8"/><text class="value" x="330" y="165" text-anchor="middle">1</text><rect x="374" y="137" width="80" height="42" rx="4" fill="white" stroke="#94a3b8"/><text class="value" x="414" y="165" text-anchor="middle">0</text><text class="small" x="20" y="241">Rot(-3)</text><rect x="122" y="213" width="80" height="42" rx="4" fill="white" stroke="#94a3b8"/><text class="value" x="162" y="241" text-anchor="middle">14</text><rect x="206" y="213" width="80" height="42" rx="4" fill="white" stroke="#94a3b8"/><text class="value" x="246" y="241" text-anchor="middle">15</text><rect x="290" y="213" width="80" height="42" rx="4" fill="white" stroke="#94a3b8"/><text class="value" x="330" y="241" text-anchor="middle">16</text><rect x="374" y="213" width="80" height="42" rx="4" fill="white" stroke="#94a3b8"/><text class="value" x="414" y="241" text-anchor="middle">1</text><text class="small" x="20" y="290">U₁</text><rect x="122" y="262" width="80" height="42" rx="4" fill="white" stroke="#94a3b8"/><text class="value" x="162" y="290" text-anchor="middle">0</text><rect x="206" y="262" width="80" height="42" rx="4" fill="white" stroke="#94a3b8"/><text class="value" x="246" y="290" text-anchor="middle">0</text><rect x="290" y="262" width="80" height="42" rx="4" fill="white" stroke="#94a3b8"/><text class="value" x="330" y="290" text-anchor="middle">0</text><rect x="374" y="262" width="80" height="42" rx="4" fill="white" stroke="#94a3b8"/><text class="value" x="414" y="290" text-anchor="middle">1</text><text class="small" x="20" y="381">RowRot</text><rect x="122" y="353" width="80" height="42" rx="4" fill="#dbeafe" stroke="#94a3b8"/><text class="value" x="162" y="381" text-anchor="middle">2</text><rect x="206" y="353" width="80" height="42" rx="4" fill="#dbeafe" stroke="#94a3b8"/><text class="value" x="246" y="381" text-anchor="middle">3</text><rect x="290" y="353" width="80" height="42" rx="4" fill="#dbeafe" stroke="#94a3b8"/><text class="value" x="330" y="381" text-anchor="middle">4</text><rect x="374" y="353" width="80" height="42" rx="4" fill="#dbeafe" stroke="#94a3b8"/><text class="value" x="414" y="381" text-anchor="middle">1</text><text class="small" x="20" y="421">U₀ keeps the first 3 columns; U₁ keeps the last one.</text></svg>
