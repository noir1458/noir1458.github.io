<svg xmlns="http://www.w3.org/2000/svg" width="480" height="390" viewBox="0 0 480 390" role="img" aria-labelledby="title desc"><title id="title">The two matrix rearrangements</title><desc id="desc">Sigma A shifts each row left by its row index. Tau B shifts each column up by its column index. The matrices shown match the four by four numeric example in the article.</desc><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#1e293b;font-size:17px}.small{font-size:15px}.title{font-size:20px;font-weight:650}.value{font-size:20px}</style><rect width="480" height="390" rx="14" fill="#f8fafc"/><text class="title" x="20" y="34">Rearrange before multiplying</text><text class="small" x="20" y="62">Row i shifts by i; column j shifts by j.</text><text x="120" y="96" text-anchor="middle">σ(A)</text><text x="360" y="96" text-anchor="middle">τ(B)</text><rect x="20" y="111" width="50" height="44" fill="#ffffff" stroke="#94a3b8"/><text x="45" y="139" text-anchor="middle">1</text><rect x="70" y="111" width="50" height="44" fill="#ffffff" stroke="#94a3b8"/><text x="95" y="139" text-anchor="middle">2</text><rect x="120" y="111" width="50" height="44" fill="#ffffff" stroke="#94a3b8"/><text x="145" y="139" text-anchor="middle">3</text><rect x="170" y="111" width="50" height="44" fill="#ffffff" stroke="#94a3b8"/><text x="195" y="139" text-anchor="middle">4</text><rect x="20" y="155" width="50" height="44" fill="#eff6ff" stroke="#94a3b8"/><text x="45" y="183" text-anchor="middle">6</text><rect x="70" y="155" width="50" height="44" fill="#eff6ff" stroke="#94a3b8"/><text x="95" y="183" text-anchor="middle">7</text><rect x="120" y="155" width="50" height="44" fill="#eff6ff" stroke="#94a3b8"/><text x="145" y="183" text-anchor="middle">8</text><rect x="170" y="155" width="50" height="44" fill="#eff6ff" stroke="#94a3b8"/><text x="195" y="183" text-anchor="middle">5</text><rect x="20" y="199" width="50" height="44" fill="#f0fdf4" stroke="#94a3b8"/><text x="45" y="227" text-anchor="middle">11</text><rect x="70" y="199" width="50" height="44" fill="#f0fdf4" stroke="#94a3b8"/><text x="95" y="227" text-anchor="middle">12</text><rect x="120" y="199" width="50" height="44" fill="#f0fdf4" stroke="#94a3b8"/><text x="145" y="227" text-anchor="middle">9</text><rect x="170" y="199" width="50" height="44" fill="#f0fdf4" stroke="#94a3b8"/><text x="195" y="227" text-anchor="middle">10</text><rect x="20" y="243" width="50" height="44" fill="#fff7ed" stroke="#94a3b8"/><text x="45" y="271" text-anchor="middle">16</text><rect x="70" y="243" width="50" height="44" fill="#fff7ed" stroke="#94a3b8"/><text x="95" y="271" text-anchor="middle">13</text><rect x="120" y="243" width="50" height="44" fill="#fff7ed" stroke="#94a3b8"/><text x="145" y="271" text-anchor="middle">14</text><rect x="170" y="243" width="50" height="44" fill="#fff7ed" stroke="#94a3b8"/><text x="195" y="271" text-anchor="middle">15</text><rect x="260" y="111" width="50" height="44" fill="#ffffff" stroke="#94a3b8"/><text x="285" y="139" text-anchor="middle">100</text><rect x="310" y="111" width="50" height="44" fill="#eff6ff" stroke="#94a3b8"/><text x="335" y="139" text-anchor="middle">600</text><rect x="360" y="111" width="50" height="44" fill="#f0fdf4" stroke="#94a3b8"/><text x="385" y="139" text-anchor="middle">1100</text><rect x="410" y="111" width="50" height="44" fill="#fff7ed" stroke="#94a3b8"/><text x="435" y="139" text-anchor="middle">1600</text><rect x="260" y="155" width="50" height="44" fill="#ffffff" stroke="#94a3b8"/><text x="285" y="183" text-anchor="middle">500</text><rect x="310" y="155" width="50" height="44" fill="#eff6ff" stroke="#94a3b8"/><text x="335" y="183" text-anchor="middle">1000</text><rect x="360" y="155" width="50" height="44" fill="#f0fdf4" stroke="#94a3b8"/><text x="385" y="183" text-anchor="middle">1500</text><rect x="410" y="155" width="50" height="44" fill="#fff7ed" stroke="#94a3b8"/><text x="435" y="183" text-anchor="middle">400</text><rect x="260" y="199" width="50" height="44" fill="#ffffff" stroke="#94a3b8"/><text x="285" y="227" text-anchor="middle">900</text><rect x="310" y="199" width="50" height="44" fill="#eff6ff" stroke="#94a3b8"/><text x="335" y="227" text-anchor="middle">1400</text><rect x="360" y="199" width="50" height="44" fill="#f0fdf4" stroke="#94a3b8"/><text x="385" y="227" text-anchor="middle">300</text><rect x="410" y="199" width="50" height="44" fill="#fff7ed" stroke="#94a3b8"/><text x="435" y="227" text-anchor="middle">800</text><rect x="260" y="243" width="50" height="44" fill="#ffffff" stroke="#94a3b8"/><text x="285" y="271" text-anchor="middle">1300</text><rect x="310" y="243" width="50" height="44" fill="#eff6ff" stroke="#94a3b8"/><text x="335" y="271" text-anchor="middle">200</text><rect x="360" y="243" width="50" height="44" fill="#f0fdf4" stroke="#94a3b8"/><text x="385" y="271" text-anchor="middle">700</text><rect x="410" y="243" width="50" height="44" fill="#fff7ed" stroke="#94a3b8"/><text x="435" y="271" text-anchor="middle">1200</text><text class="small" x="20" y="326">At (i,j), both values use inner index (i+j) mod d.</text><text class="small" x="20" y="359">Further row / column shifts advance that index.</text></svg>
