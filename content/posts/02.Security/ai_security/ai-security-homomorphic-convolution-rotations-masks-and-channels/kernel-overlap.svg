<svg xmlns="http://www.w3.org/2000/svg" width="480" height="430" viewBox="0 0 480 430" role="img" aria-labelledby="title desc"><title id="title">Kernel overlap at the image center</title><desc id="desc">A three by three patch centered at thirteen contains 7,8,9;12,13,14;17,18,19. Multiply by the matching kernel values 100 through 900, then sum to get 68100. At the top left corner, values outside the image are zero.</desc><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#1e293b;font-size:17px}.small{font-size:15px}.title{font-size:20px;font-weight:650}.value{font-size:21px}</style><rect width="480" height="430" rx="14" fill="#f8fafc"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/></marker></defs><text class="title" x="24" y="34">Kernel overlap at the center</text><text class="small" x="24" y="61">Place the kernel center on 13, then multiply and add.</text><text x="114" y="96" text-anchor="middle">Input patch</text><text x="366" y="96" text-anchor="middle">Kernel</text><rect x="24" y="110" width="60" height="56" fill="white" stroke="#94a3b8" stroke-width="1"/><text class="value" x="54" y="146" text-anchor="middle">7</text><rect x="84" y="110" width="60" height="56" fill="white" stroke="#94a3b8" stroke-width="1"/><text class="value" x="114" y="146" text-anchor="middle">8</text><rect x="144" y="110" width="60" height="56" fill="white" stroke="#94a3b8" stroke-width="1"/><text class="value" x="174" y="146" text-anchor="middle">9</text><rect x="24" y="166" width="60" height="56" fill="white" stroke="#94a3b8" stroke-width="1"/><text class="value" x="54" y="202" text-anchor="middle">12</text><rect x="84" y="166" width="60" height="56" fill="#ffe4e6" stroke="#be123c" stroke-width="2"/><text class="value" x="114" y="202" text-anchor="middle">13</text><rect x="144" y="166" width="60" height="56" fill="white" stroke="#94a3b8" stroke-width="1"/><text class="value" x="174" y="202" text-anchor="middle">14</text><rect x="24" y="222" width="60" height="56" fill="white" stroke="#94a3b8" stroke-width="1"/><text class="value" x="54" y="258" text-anchor="middle">17</text><rect x="84" y="222" width="60" height="56" fill="white" stroke="#94a3b8" stroke-width="1"/><text class="value" x="114" y="258" text-anchor="middle">18</text><rect x="144" y="222" width="60" height="56" fill="white" stroke="#94a3b8" stroke-width="1"/><text class="value" x="174" y="258" text-anchor="middle">19</text><rect x="276" y="110" width="60" height="56" fill="white" stroke="#94a3b8" stroke-width="1"/><text class="value" x="306" y="146" text-anchor="middle">100</text><rect x="336" y="110" width="60" height="56" fill="white" stroke="#94a3b8" stroke-width="1"/><text class="value" x="366" y="146" text-anchor="middle">200</text><rect x="396" y="110" width="60" height="56" fill="white" stroke="#94a3b8" stroke-width="1"/><text class="value" x="426" y="146" text-anchor="middle">300</text><rect x="276" y="166" width="60" height="56" fill="white" stroke="#94a3b8" stroke-width="1"/><text class="value" x="306" y="202" text-anchor="middle">400</text><rect x="336" y="166" width="60" height="56" fill="#ffe4e6" stroke="#be123c" stroke-width="2"/><text class="value" x="366" y="202" text-anchor="middle">500</text><rect x="396" y="166" width="60" height="56" fill="white" stroke="#94a3b8" stroke-width="1"/><text class="value" x="426" y="202" text-anchor="middle">600</text><rect x="276" y="222" width="60" height="56" fill="white" stroke="#94a3b8" stroke-width="1"/><text class="value" x="306" y="258" text-anchor="middle">700</text><rect x="336" y="222" width="60" height="56" fill="white" stroke="#94a3b8" stroke-width="1"/><text class="value" x="366" y="258" text-anchor="middle">800</text><rect x="396" y="222" width="60" height="56" fill="white" stroke="#94a3b8" stroke-width="1"/><text class="value" x="426" y="258" text-anchor="middle">900</text><text class="value" x="240" y="205" text-anchor="middle">×</text><text x="24" y="322">Sum of 9 products = 68100</text><text class="small" x="24" y="368">At the corner, use zero outside the image.</text><text class="small" x="24" y="400">500×1 + 600×2 + 800×6 + 900×7 = 12800</text></svg>