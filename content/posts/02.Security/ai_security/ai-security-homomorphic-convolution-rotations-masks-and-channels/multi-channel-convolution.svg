<svg xmlns="http://www.w3.org/2000/svg" width="480" height="550" viewBox="0 0 480 550" role="img" aria-labelledby="title desc"><title id="title">Channel contributions are added for each output</title><desc id="desc">Three input channels are convolved with their three separate kernel slices for one output channel. Add the three results at matching coordinates to obtain one H by W map. Repeating with another filter bank gives another output channel.</desc><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#1e293b;font-size:17px}.small{font-size:15px}.title{font-size:20px;font-weight:650}.value{font-size:21px}</style><rect width="480" height="550" rx="14" fill="#f8fafc"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/></marker></defs><text class="title" x="24" y="34">Input channels → one output channel</text><text class="small" x="24" y="61">Add contributions at matching image coordinates.</text><rect x="24" y="100" width="119" height="64" rx="7" fill="white" stroke="#2563eb" stroke-width="1.5"/><text x="83.5" y="127" text-anchor="middle">Input</text><text class="small" x="83.5" y="149" text-anchor="middle">channel 0</text><path d="M 144 132 L 173 132" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="180" y="100" width="140" height="64" rx="7" fill="white" stroke="#2563eb" stroke-width="1.5"/><text x="250" y="127" text-anchor="middle">2D Conv</text><text class="small" x="250" y="150" text-anchor="middle">kernel Fₒ,₀</text><path d="M 321 132 L 358 132 L 358 232 L 376 232" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="200" width="119" height="64" rx="7" fill="white" stroke="#15803d" stroke-width="1.5"/><text x="83.5" y="227" text-anchor="middle">Input</text><text class="small" x="83.5" y="249" text-anchor="middle">channel 1</text><path d="M 144 232 L 173 232" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="180" y="200" width="140" height="64" rx="7" fill="white" stroke="#15803d" stroke-width="1.5"/><text x="250" y="227" text-anchor="middle">2D Conv</text><text class="small" x="250" y="250" text-anchor="middle">kernel Fₒ,₁</text><path d="M 321 232 L 376 232" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="300" width="119" height="64" rx="7" fill="white" stroke="#c2410c" stroke-width="1.5"/><text x="83.5" y="327" text-anchor="middle">Input</text><text class="small" x="83.5" y="349" text-anchor="middle">channel 2</text><path d="M 144 332 L 173 332" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="180" y="300" width="140" height="64" rx="7" fill="white" stroke="#c2410c" stroke-width="1.5"/><text x="250" y="327" text-anchor="middle">2D Conv</text><text class="small" x="250" y="350" text-anchor="middle">kernel Fₒ,₂</text><path d="M 321 332 L 358 332 L 358 232 L 376 232" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><circle cx="400" cy="232" r="21" fill="white" stroke="#64748b" stroke-width="1.5"/><text class="value" x="400" y="239" text-anchor="middle">+</text><path d="M 400 254 L 400 416" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="424" width="432" height="63" rx="8" fill="#e8f0fb" stroke="#64748b"/><text x="240" y="462" text-anchor="middle">Output channel o: one H × W map</text><text class="small" x="24" y="530">Repeat with another filter bank for each output.</text></svg>