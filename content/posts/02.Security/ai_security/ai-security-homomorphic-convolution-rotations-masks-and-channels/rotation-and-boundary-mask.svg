<svg xmlns="http://www.w3.org/2000/svg" width="480" height="510" viewBox="0 0 480 510" role="img" aria-labelledby="title desc"><title id="title">A row boundary needs a zero weight</title><desc id="desc">The first row of a one-slot left rotation is 2,3,4,5,6. The six is from the next row. Weights 600,600,600,600,0 give products 1200,1800,2400,3000,0.</desc><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#1e293b;font-size:17px}.small{font-size:15px}.title{font-size:20px;font-weight:650}.value{font-size:21px}</style><rect width="480" height="510" rx="14" fill="#f8fafc"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/></marker></defs><text class="title" x="24" y="34">Rotation needs a boundary mask</text><text class="small" x="24" y="61">5 columns; right neighbour; shift +1.</text><text class="small" x="24" y="86">Rotated input</text><rect x="24" y="100" width="80" height="58" rx="5" fill="white" stroke="#94a3b8"/><text class="value" x="64" y="137" text-anchor="middle">2</text><rect x="112" y="100" width="80" height="58" rx="5" fill="white" stroke="#94a3b8"/><text class="value" x="152" y="137" text-anchor="middle">3</text><rect x="200" y="100" width="80" height="58" rx="5" fill="white" stroke="#94a3b8"/><text class="value" x="240" y="137" text-anchor="middle">4</text><rect x="288" y="100" width="80" height="58" rx="5" fill="white" stroke="#94a3b8"/><text class="value" x="328" y="137" text-anchor="middle">5</text><rect x="376" y="100" width="80" height="58" rx="5" fill="#ffe4e6" stroke="#be123c"/><text class="value" x="416" y="137" text-anchor="middle">6</text><text class="small" x="24" y="212">Weight × validity</text><rect x="24" y="226" width="80" height="58" rx="5" fill="white" stroke="#94a3b8"/><text class="value" x="64" y="263" text-anchor="middle">600</text><rect x="112" y="226" width="80" height="58" rx="5" fill="white" stroke="#94a3b8"/><text class="value" x="152" y="263" text-anchor="middle">600</text><rect x="200" y="226" width="80" height="58" rx="5" fill="white" stroke="#94a3b8"/><text class="value" x="240" y="263" text-anchor="middle">600</text><rect x="288" y="226" width="80" height="58" rx="5" fill="white" stroke="#94a3b8"/><text class="value" x="328" y="263" text-anchor="middle">600</text><rect x="376" y="226" width="80" height="58" rx="5" fill="#dbeafe" stroke="#94a3b8"/><text class="value" x="416" y="263" text-anchor="middle">0</text><text class="small" x="24" y="338">Product for this direction</text><rect x="24" y="352" width="80" height="58" rx="5" fill="white" stroke="#94a3b8"/><text class="value" x="64" y="389" text-anchor="middle">1200</text><rect x="112" y="352" width="80" height="58" rx="5" fill="white" stroke="#94a3b8"/><text class="value" x="152" y="389" text-anchor="middle">1800</text><rect x="200" y="352" width="80" height="58" rx="5" fill="white" stroke="#94a3b8"/><text class="value" x="240" y="389" text-anchor="middle">2400</text><rect x="288" y="352" width="80" height="58" rx="5" fill="white" stroke="#94a3b8"/><text class="value" x="328" y="389" text-anchor="middle">3000</text><rect x="376" y="352" width="80" height="58" rx="5" fill="#dbeafe" stroke="#94a3b8"/><text class="value" x="416" y="389" text-anchor="middle">0</text><text class="value" x="240" y="189" text-anchor="middle">×</text><text class="value" x="240" y="315" text-anchor="middle">=</text><text class="small" x="24" y="454">The 6 belongs to the next image row.</text><text class="small" x="24" y="483">Its weight is 0 at the row boundary.</text></svg>